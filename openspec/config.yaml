schema: spec-driven

context: |
  Language: es
  All artifacts must be written in es.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Producto: Matiz ("matiz" = hue/nuance). Utilidad de escritorio para Windows para capturar,
  analizar y crear paletas de colores, pensada para desarrolladores/diseñadores que la tienen
  abierta mientras trabajan. Flujo central: "veo un color -> lo capturo -> lo analizo ->
  genero una paleta -> copio los valores -> sigo trabajando".

  Stack: C# / .NET 10 / WPF / MVVM (CommunityToolkit.Mvvm). Sin frameworks de UI grandes.
  Proyectos: Matiz.Core (net10.0, sin dependencias de WPF: modelo de color, conversiones,
  parsing/formatos, generación de paletas, persistencia JSON), Matiz.App (net10.0-windows,
  WPF: vistas, view models, controles, interop Win32), Matiz.Core.Tests (xUnit).
  Persistencia: JSON en %APPDATA%\Matiz. Proceso Per-Monitor DPI Aware v2.

  Filosofía: herramienta pequeña, rápida y simple. Una funcionalidad con mucha complejidad y
  poco valor se planifica como futura. Tests donde aportan (Core), no tests exhaustivos de UI.

rules:
  tasks:
    - Agrupar tareas por fase; cada fase termina en un entregable usable
    - Cada tarea indica cómo se verifica (test, comando o comportamiento observable)
  specs:
    - Los escenarios usan valores concretos verificables (por ejemplo #5246BC)
